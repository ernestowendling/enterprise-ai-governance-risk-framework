disclaimer: This questionnaire is a structured decision aid and does not replace expert risk, legal, compliance or model-risk judgement.
questions:
  - {question_id: Q01, risk_domain: Strategic, question: "Are intended use prohibited uses and expected benefits explicitly defined?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Approved use statement and prohibited-use register, negative_finding: Intended use and boundaries are not adequately defined., owner: Business Owner, lifecycle_implication: Assessment approval blocked}
  - {question_id: Q02, risk_domain: Customer / Conduct, question: "Does the AI influence a consequential customer decision?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], evidence_expectation: Customer-impact assessment, owner: Compliance}
  - {question_id: Q03, risk_domain: Customer / Conduct, question: "Are customer outcome risks and vulnerable-customer impacts assessed?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Conduct-risk assessment and outcome testing, negative_finding: Customer outcome assessment is incomplete., owner: Compliance, lifecycle_implication: Approval condition required}
  - {question_id: Q04, risk_domain: Model, question: "Are performance acceptance criteria defined before deployment?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Approved performance test plan and acceptance thresholds, negative_finding: Performance acceptance criteria are not evidenced., owner: Technical Owner, lifecycle_implication: Validation and approval blocked}
  - {question_id: Q05, risk_domain: Model, question: "Are model limitations documented and communicated to users?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Model documentation and user guidance, negative_finding: Material model limitations are not communicated., owner: Technical Owner, lifecycle_implication: Validation blocked}
  - {question_id: Q06, risk_domain: Data, question: "Is input data demonstrably representative for intended use?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Representativeness analysis, negative_finding: Data representativeness is not demonstrated., owner: Data Owner, lifecycle_implication: Validation blocked}
  - {question_id: Q07, risk_domain: Data, question: "Are lineage quality controls and data exceptions evidenced?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Lineage record and data-quality report, negative_finding: Required data lineage or quality evidence is missing., owner: Data Owner, lifecycle_implication: Approval gate blocked}
  - {question_id: Q08, risk_domain: Privacy, question: "Is personal or sensitive data processed under an approved governance basis?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Privacy assessment and data-use approval, negative_finding: Personal-data governance is not evidenced., owner: Privacy Officer, lifecycle_implication: Approval gate blocked}
  - {question_id: Q09, risk_domain: Security, question: "Are threat misuse access and data-leakage scenarios tested?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Security assessment and test evidence, negative_finding: Material AI security scenarios are not tested., owner: Information Security, lifecycle_implication: Approval gate blocked}
  - {question_id: Q10, risk_domain: Operational, question: "Is there a tested fallback and business-continuity mechanism?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Fallback procedure and exercise result, negative_finding: Operational fallback is not demonstrated., owner: Business Owner, lifecycle_implication: Production entry blocked}
  - {question_id: Q11, risk_domain: Legal / Regulatory, question: "Have applicable legal and regulatory obligations been assessed by competent functions?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Legal and compliance assessment, negative_finding: Applicable obligations have not been assessed., owner: Compliance, lifecycle_implication: Approval blocked}
  - {question_id: Q12, risk_domain: Third-Party, question: "Is material dependency on an external model or provider controlled?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Due diligence contract controls and exit plan, negative_finding: Third-party AI dependency is not adequately controlled., owner: Third-Party Risk, lifecycle_implication: Approval condition required}
  - {question_id: Q13, risk_domain: Explainability, question: "Can an affected individual obtain an intelligible explanation?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Explanation design and comprehension testing, negative_finding: Intelligible explanation is not demonstrated., owner: Business Owner, lifecycle_implication: Approval blocked for consequential decisions}
  - {question_id: Q14, risk_domain: Bias / Fairness, question: "Have bias and fairness risks been assessed for the relevant context?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Contextual fairness assessment and governance conclusion, negative_finding: Bias and fairness assessment is incomplete., owner: Compliance, lifecycle_implication: Approval blocked for people-impacting AI}
  - {question_id: Q15, risk_domain: Human Oversight, question: "Can a competent human reviewer effectively override the system?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Reviewer role override authority stop authority and decision evidence, negative_finding: Mandatory human-oversight capability not evidenced., owner: Business Owner, lifecycle_implication: Approval gate blocked}
  - {question_id: Q16, risk_domain: Human Oversight, question: "Is there sufficient human competence and capacity to perform oversight?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Training capacity analysis and operating procedure, negative_finding: Human oversight competence or capacity is not demonstrated., owner: Business Owner, lifecycle_implication: Production entry blocked}
  - {question_id: Q17, risk_domain: Operational, question: "Are monitoring metrics thresholds and accountable responses defined?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Approved monitoring plan, negative_finding: Monitoring thresholds and responses are not approved., owner: Technical Owner, lifecycle_implication: Production entry blocked}
  - {question_id: Q18, risk_domain: Operational, question: "Are incidents escalation and suspension routes documented?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Incident and escalation procedure, negative_finding: AI incident escalation is not operationalised., owner: Operational Risk, lifecycle_implication: Approval condition required}
  - {question_id: Q19, risk_domain: Third-Party, question: "Would a material provider or model-version change trigger revalidation?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: Change notification and revalidation rule, negative_finding: Provider change is not connected to revalidation., owner: Third-Party Risk, lifecycle_implication: Approval condition required}
  - {question_id: Q20, risk_domain: Reputational, question: "Are plausible public trust and reputational scenarios assessed?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], evidence_expectation: Reputational risk scenario assessment, owner: Business Owner}
  - {question_id: Q21, risk_domain: Generative AI, question: "Where applicable are grounding prompt injection hallucination and output controls tested?", answer_options: ["YES", "PARTIAL", "NO", "NOT APPLICABLE"], material: true, evidence_expectation: GenAI evaluation and red-team evidence, negative_finding: Generative AI output controls are not evidenced., owner: Product Owner, lifecycle_implication: Approval blocked for Generative AI}


