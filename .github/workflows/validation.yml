name: Governance framework validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest
      - name: Domain import smoke check
        run: python -c "import governance_workspace, findings; from assessments.ai_risk_assessment import load_questions; assert len(load_questions()) >= 15"
      - name: YAML validation
        run: python -c "import yaml, pathlib; files=list(pathlib.Path('.').rglob('*.yaml')); [yaml.safe_load(p.read_text()) for p in files]; print(f'Validated {len(files)} YAML files')"
